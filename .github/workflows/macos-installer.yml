name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag; leave blank to use app.__version__
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            name: Intel Macs
            asset_arch: x86_64
          - runner: macos-14
            name: Apple Silicon Macs
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read release metadata
        id: metadata
        run: |
          VERSION="$(python3 -c 'from app import __version__; print(__version__)')"
          RELEASE_TAG="${{ inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build the app and installer zip
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPoint-macOS-${{ matrix.asset_arch }}-${{ steps.metadata.outputs.version }}
          path: mac_installer/AirPoint-macOS-*.zip
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" mac_installer/AirPoint-macOS-*.zip --clobber
